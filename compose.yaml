# Standalone container: no Super Pi Hole dependency or Docker socket.
# Set GUI_CACHE_IP and GUI_PUBLIC_ORIGIN for your own server before deployment.
services:
  lancache:
    image: ghcr.io/hdr-performance/super-lan-cache:0.1.4
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "20722:20722"
    environment:
      GUI_CACHE_IP: "${LANCACHE_SERVER_IP:?Set LANCACHE_SERVER_IP to the cache server LAN IPv4 address}"
      GUI_PUBLIC_ORIGIN: "${LANCACHE_PUBLIC_ORIGIN:-http://${LANCACHE_SERVER_IP}:20722}"
      CACHE_DISK_SIZE: "1000g"
      CACHE_INDEX_SIZE: "500m"
      MIN_FREE_DISK: "10g"
      CACHE_MAX_AGE: "3560d"
      UPSTREAM_DNS: "1.1.1.1 1.0.0.1"
      TZ: "Etc/UTC"
    volumes:
      - cache:/data/cache
      - logs:/data/logs
      - manager:/data/manager
  lancache-dns:
    image: ghcr.io/hdr-performance/super-lan-cache:0.1.4
    restart: unless-stopped
    network_mode: host
    entrypoint: ["/usr/local/bin/node", "/opt/lancache-gui/server/dns-service.mjs"]
    healthcheck:
      disable: true
    environment:
      GUI_CACHE_IP: "${LANCACHE_SERVER_IP:?Set LANCACHE_SERVER_IP to the cache server LAN IPv4 address}"
      GUI_DATA: "/data/manager"
      GUI_DNS_PORT: "53"
      TZ: "Etc/UTC"
    volumes:
      - manager:/data/manager
    tmpfs:
      - /data/cache
      - /data/logs
      - /data/cachedomains
      - /var/www
    depends_on:
      - lancache
volumes:
  cache:
  logs:
  manager:
