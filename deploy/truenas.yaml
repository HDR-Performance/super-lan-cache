# Replace every 192.168.1.10 and /mnt/tank/apps/super-lan-cache with your LAN address and datasets.
# Existing caches: mount the folder containing CONFIGHASH and cache/, not cache/ itself.
services:
  lancache:
    image: ghcr.io/hdr-performance/super-lan-cache:0.1.5
    platform: linux/amd64
    restart: unless-stopped
    ports: ["80:80", "443:443", "20722:20722"]
    environment:
      GUI_CACHE_IP: "192.168.1.10"
      GUI_PUBLIC_ORIGIN: "http://192.168.1.10:20722"
      CACHE_DISK_SIZE: "1000g"
      CACHE_INDEX_SIZE: "500m"
      MIN_FREE_DISK: "10g"
      CACHE_MAX_AGE: "3560d"
      UPSTREAM_DNS: "1.1.1.1 1.0.0.1"
      TZ: "Etc/UTC"
    volumes:
      - type: bind
        source: /mnt/tank/apps/super-lan-cache/cache
        target: /data/cache
        bind: {create_host_path: false}
      - type: bind
        source: /mnt/tank/apps/super-lan-cache/logs
        target: /data/logs
        bind: {create_host_path: false}
      - type: bind
        source: /mnt/tank/apps/super-lan-cache/manager
        target: /data/manager
        bind: {create_host_path: false}
  lancache-dns:
    image: ghcr.io/hdr-performance/super-lan-cache:0.1.5
    platform: linux/amd64
    restart: unless-stopped
    network_mode: host
    entrypoint: ["/usr/local/bin/node", "/opt/lancache-gui/server/dns-service.mjs"]
    healthcheck:
      disable: true
    environment:
      GUI_CACHE_IP: "192.168.1.10"
      GUI_DATA: "/data/manager"
      GUI_DNS_PORT: "53"
      TZ: "Etc/UTC"
    volumes:
      - type: bind
        source: /mnt/tank/apps/super-lan-cache/manager
        target: /data/manager
        bind: {create_host_path: false}
    tmpfs:
      - /data/cache
      - /data/logs
      - /data/cachedomains
      - /var/www
    depends_on:
      - lancache
x-portals:
  - name: Web UI
    host: 192.168.1.10
    port: 20722
    scheme: http
    path: /
x-notes: >
  Super Lan-Cache combines the cache engine and management interface with an optional built-in DNS sidecar.
  New installs have no login password; enable one in Settings if desired.
  Built-in DNS starts disabled. Super Pi Hole is optional. Existing cache files are inventoried automatically.
